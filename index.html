<script>
  const sheetURL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vRMmQHmTBOEN2tlzCLaC2QXgQovOy4HFTlNe-VIAsh0B-ryUcV-nujXuGkRVpCtKCaJXdnqQoS0TG7N/pubhtml";

  fetch(sheetURL)
    .then(res => res.text())
    .then(html => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      // Google Sheets uses <table class="waffle">
      const table = doc.querySelector("table.waffle");

      if (!table) {
        console.error("No table found in published sheet.");
        return;
      }

      const rows = [...table.querySelectorAll("tr")];

      // Skip header row (row 0)
      const dataRows = rows.slice(1);

      const grid = document.getElementById("hatGrid");

      dataRows.forEach(row => {
        const cells = [...row.querySelectorAll("td")].map(td => td.innerText.trim());

        // Adjust based on your sheet columns:
        const [name, description, imageURL] = cells;

        const card = document.createElement("div");
        card.className = "hat-card";

        card.innerHTML = `
          <h3>${name}</h3>
          <p>${description}</p>
          ${imageURL ? `<img src="${imageURL}" alt="${name}">` : ""}
        `;

        grid.appendChild(card);
      });
    });
</script>
