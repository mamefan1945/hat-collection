<script>
  const sheetURL =
    "https://docs.google.com/spreadsheets/d/1ys8ZGnyCHMCB7icu4CsZZGDSmth6vYOnxmByU-tI2Ws/gviz/tq?tqx=out:json";

  async function loadHats() {
    const raw = await fetch(sheetURL).then(r => r.text());
    const json = JSON.parse(raw.substring(47, raw.length - 2));

    const rows = json.table.rows.map(r => r.c.map(c => c ? c.v : ""));

    const hats = rows.map(([name, description, image]) => ({
      name, description, image
    }));

    const carousel = document.getElementById("carousel");

    function render(list) {
      carousel.innerHTML = "";
      list.forEach(h => {
        const card = document.createElement("div");
        card.className = "hat";
        card.innerHTML = `
          <img src="${h.image}">
          <h3>${h.name}</h3>
        `;
        card.onclick = () => openModal(h);
        carousel.appendChild(card);
      });
    }

    function openModal(hat) {
      document.getElementById("modalName").innerText = hat.name;
      document.getElementById("modalDesc").innerText = hat.description;
      document.getElementById("modalImg").src = hat.image;
      document.getElementById("modal").style.display = "flex";
    }

    document.getElementById("closeBtn").onclick =
      () => document.getElementById("modal").style.display = "none";

    document.getElementById("searchBox").oninput = (e) => {
      const q = e.target.value.toLowerCase();
      render(hats.filter(h => h.name.toLowerCase().includes(q)));
    };

    render(hats);
  }

  loadHats();
</script>
