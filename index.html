<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Hat Collection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      padding: 20px 0;
      margin: 0;
      font-size: 32px;
    }

    #searchBox {
      display: block;
      margin: 10px auto 20px auto;
      padding: 10px;
      width: 300px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }

    /* Carousel container */
    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 40px;
      padding: 40px;
      scrollbar-width: none;
    }
    .carousel::-webkit-scrollbar {
      display: none;
    }

    /* Each hat card */
    .hat {
      flex: 0 0 300px;
      scroll-snap-align: center;
      text-align: center;
      transition: transform 0.3s;
      cursor: pointer;
    }

    .hat img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
      transition: transform 0.3s;
    }

    .hat:hover img {
      transform: scale(1.08);
    }

    .hat h3 {
      margin-top: 10px;
      font-size: 20px;
    }

    /* Modal */
    #modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
    }

    #modalContent {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 600px;
      color: white;
    }

    #modalContent img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    #closeBtn {
      float: right;
      cursor: pointer;
      font-size: 24px;
    }
  </style>
</head>
<body>

<h1>My Hat Collection</h1>
<input id="searchBox" type="text" placeholder="Search hats...">

<div id="carousel" class="carousel"></div>

<!-- Modal -->
<div id="modal">
  <div id="modalContent">
    <span id="closeBtn">&times;</span>
    <h2 id="modalName"></h2>
    <img id="modalImg">
    <p id="modalDesc"></p>
  </div>
</div>

<script>
  const sheetURL =
    "https://docs.google.com/spreadsheets/d/1ys8ZGnyCHMCB7icu4CsZZGDSmth6vYOnxmByU-tI2Ws/gviz/tq?tqx=out:json";

  async function loadHats() {
    const raw = await fetch(sheetURL).then(r => r.text());
    const json = JSON.parse(raw.substring(47, raw.length - 2));

    const rows = json.table.rows.map(r => r.c.map(c => c ? c.v : ""));

    const hats = rows.map(([name, description, image]) => ({
      name, description, image
    }));

    const carousel = document.getElementById("carousel");

    function render(list) {
      carousel.innerHTML = "";
      list.forEach(h => {
        const card = document.createElement("div");
        card.className = "hat";
        card.innerHTML = `
          <img src="${h.image}">
          <h3>${h.name}</h3>
        `;
        card.onclick = () => openModal(h);
        carousel.appendChild(card);
      });
    }

    function openModal(hat) {
      document.getElementById("modalName").innerText = hat.name;
      document.getElementById("modalDesc").innerText = hat.description;
      document.getElementById("modalImg").src = hat.image;
      document.getElementById("modal").style.display = "flex";
    }

    document.getElementById("closeBtn").onclick =
      () => document.getElementById("modal").style.display = "none";

    document.getElementById("searchBox").oninput = (e) => {
      const q = e.target.value.toLowerCase();
      render(hats.filter(h => h.name.toLowerCase().includes(q)));
    };

    render(hats);
  }

  loadHats();
</script>

</body>
</html>
